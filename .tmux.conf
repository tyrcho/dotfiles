# Dogpark's tmux config, written to ~/.tmux.conf by `dogpark install` (and to a worker by create-worker.sh) only
# where there is no tmux config at all. Change it as you like: Dogpark never writes over a config that exists.

# The prefix is tmux's own, Ctrl-b: press it, let go, then the key (Ctrl-b c opens a window, Ctrl-b d detaches).

# ==========================
# General
# ==========================
# tmux-256color where this machine's terminfo has it (an older macOS lacks it), screen-256color where not.
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal tmux-256color' 'set -g default-terminal screen-256color'
set -ag terminal-overrides ",xterm-256color:RGB"
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 10
set -g focus-events on
# How Dogpark finds a terminal that is already open on a session: the same title install.py and create-worker.sh set.
set -g set-titles on
set -g set-titles-string '#H:#S.#I.#P #W #T'

# ==========================
# Mouse & Input
# ==========================
# Click a window in the status line to go to it, click a pane to choose it, drag a border to resize, scroll to read back.
set -g mouse on
set -g status-keys vi
setw -g mode-keys vi

# ==========================
# Copy mode: v selects, y copies
# ==========================
# Copied text goes to your own computer's clipboard through the terminal (OSC 52), over ssh too.
set -s set-clipboard on
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# ==========================
# Key bindings
# ==========================
# Split side by side with |, one above the other with -, in the pane's own folder.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# Read this file again with r.
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# ==========================
# Bells
# ==========================
set -g bell-action any
set -g visual-bell on

# ==========================
# Status bar
# ==========================
set -g status-style 'bg=black,fg=white'
set -g status-justify left
set -g status-left-length 40
set -g status-left '#[fg=green][#[fg=red]#H#[fg=green]:#[fg=white]#S#[fg=green]]#[default] '
set -g status-right '#[fg=blue]%Y-%m-%d #[fg=white]%H:%M#[default]'

# ==========================
# Window & pane appearance
# ==========================
setw -g window-status-style 'bg=black'
setw -g window-status-current-style 'fg=green'
set -g pane-border-style 'fg=white,bg=black'
set -g pane-active-border-style 'fg=green,bg=black'
set -g message-style 'fg=black,bg=green'
